name: C++ foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  runtime-tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime race-test dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libssl-dev libgtest-dev
      - name: Build and test owner-thread runtime with ThreadSanitizer
        run: |
          cmake -S . -B build-tsan -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DROLLUPX_CORE_ONLY=ON -DROLLUPX_TSAN=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-tsan --target runtime_tests --parallel 2
          ctest --test-dir build-tsan -R '^runtime_tests$' --output-on-failure --output-junit runtime-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-tsan-results
          path: |
            build-tsan/runtime-results.xml
            build-tsan/Testing/Temporary/LastTest.log
  protobuf-wire:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        sanitize: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v4
      - name: Install protobuf and offline-core dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev libgtest-dev libprotobuf-dev protobuf-compiler
      - name: Build and test real protobuf validation without gRPC or RocksDB
        run: |
          cmake -S . -B build-wire -G Ninja -DROLLUPX_WIRE_ONLY=ON -DCMAKE_BUILD_TYPE=Debug -DROLLUPX_SANITIZE=${{ matrix.sanitize }}
          cmake --build build-wire --parallel 2
          ctest --test-dir build-wire --output-on-failure --output-junit wire-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wire-results-sanitize-${{ matrix.sanitize }}
          path: |
            build-wire/wire-results.xml
            build-wire/Testing/Temporary/LastTest.log
  standalone-ledger:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        sanitize: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v4
      - name: Install real RocksDB and test dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build librocksdb-dev libssl-dev libgtest-dev
      - name: Build standalone ledger without gRPC
        run: |
          cmake -S . -B build-ledger -G Ninja -DROLLUPX_LEDGER_ONLY=ON -DCMAKE_BUILD_TYPE=Debug -DROLLUPX_SANITIZE=${{ matrix.sanitize }}
          cmake --build build-ledger --parallel 2
      - name: Run ledger/Raft persistence, process crash/recovery, and standalone CLI tests
        run: ctest --test-dir build-ledger --output-on-failure --output-junit ledger-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ledger-results-sanitize-${{ matrix.sanitize }}
          path: |
            build-ledger/ledger-results.xml
            build-ledger/Testing/Temporary/LastTest.log
  offline-core:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        sanitize: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v4
      - name: Install offline-core dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev libgtest-dev
      - name: Build crypto and reference execution without networking/storage dependencies
        run: |
          cmake -S . -B build-core -G Ninja -DCMAKE_BUILD_TYPE=Debug -DROLLUPX_CORE_ONLY=ON -DROLLUPX_SANITIZE=${{ matrix.sanitize }}
          cmake --build build-core --parallel 2
      - name: Verify crypto, execution, Raft simulations, and offline wallet
        run: ctest --test-dir build-core --output-on-failure
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitize: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc librocksdb-dev libssl-dev libgtest-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DROLLUPX_SANITIZE=${{ matrix.sanitize }}
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Unit and real five-process integration tests
        run: ctest --test-dir build --output-on-failure --output-junit results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-sanitize-${{ matrix.sanitize }}
          path: |
            build/results.xml
            build/Testing/Temporary/LastTest.log
  compose-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Five-node Compose transport and restart
        run: bash scripts/compose-smoke.sh
# Foundry and consensus fault jobs are added with their implementations in Phases 3/5.
# There is no empty passing contract job.
