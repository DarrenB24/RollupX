syntax = "proto3";
package rollupx.internal.v1;

// Internal-only listener. Plaintext is for a private local test network only.
service PeerTransport {
  rpc Probe(ProbeRequest) returns (ProbeResponse);
}
message ProbeRequest {
  string cluster_id = 1;
  string sender_id = 2;
  uint32 protocol_version = 3;
  string topology = 4; // Canonical sorted member IDs and internal endpoints.
}
message ProbeResponse {
  string cluster_id = 1;
  string node_id = 2;
  uint32 protocol_version = 3;
}

// Phase 3 wire contract. Until implemented the server returns UNIMPLEMENTED.
// Probe above is NOT a Raft heartbeat and never advances any consensus state.
service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}
message RequestVoteRequest {
  string cluster_id = 1;
  string candidate_id = 2;
  uint64 term = 3;
  uint64 last_log_index = 4;
  uint64 last_log_term = 5;
}
message RequestVoteResponse { uint64 term = 1; bool vote_granted = 2; }
message LogEntry { uint64 index = 1; uint64 term = 2; bytes command = 3; }
message AppendEntriesRequest {
  string cluster_id = 1;
  string leader_id = 2;
  uint64 term = 3;
  uint64 prev_log_index = 4;
  uint64 prev_log_term = 5;
  repeated LogEntry entries = 6;
  uint64 leader_commit = 7;
}
message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
  uint64 conflict_index = 4;
  uint64 conflict_term = 5;
}
message InstallSnapshotRequest {
  string cluster_id = 1;
  string leader_id = 2;
  uint64 term = 3;
  uint64 last_included_index = 4;
  uint64 last_included_term = 5;
  bytes snapshot_id = 6;
  uint64 offset = 7;
  bytes chunk = 8;
  bool done = 9;
  bytes checksum = 10;
}
message InstallSnapshotResponse { uint64 term = 1; bool accepted = 2; uint64 next_offset = 3; }
